<!-- Collapsed, because a full diff dwarfs the prose. The raw <pre> shows when the CDN fails.
     Put the diff in BUILD/pr.diff (gh pr diff). -->
<details class="diff" id="diff-panel"><summary>Show the diff (+N −M)</summary>
  <div class="wide"><div id="diff-view"></div></div>
</details>
<details class="diff" id="diff-fallback"><summary>Raw diff</summary><pre><code><!-- text:pr.diff --></code></pre></details>
<textarea id="diff-src" hidden aria-hidden="true"><!-- text:pr.diff --></textarea>
