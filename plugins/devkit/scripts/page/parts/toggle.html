<!-- Without JS both panels show, each under its own heading. -->
<div x-data="{v: 'before'}">
  <div class="seg" role="tablist" x-cloak>
    <button role="tab" :aria-selected="v==='before'" @click="v='before'">Before</button>
    <button role="tab" :aria-selected="v==='after'" @click="v='after'">After</button>
  </div>
  <section x-show="v==='before'"><h3>Before</h3>...</section>
  <section x-show="v==='after'"><h3>After</h3>...</section>
</div>
