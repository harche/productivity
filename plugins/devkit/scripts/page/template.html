<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" href="data:,">
<!-- pagekit build swaps this for pinned library tags with SRI. init fills it from --with. -->
<meta name="devkit-libs" content="{{LIBS}}">
<style>
/* Theme tokens. Light on bare :root; dark under the OS preference unless the host forces
   data-theme="light", and again under data-theme="dark" so a host toggle wins both ways.
   Tune --accent (and fonts, if the subject calls for it) per page; keep the three-block shape. */
:root {
  --bg: #ffffff; --surface: #f6f8fa; --border: #d0d7de; --fg: #1f2328; --muted: #59636e;
  --accent: #0969da; --on-accent: #ffffff; --add: #1a7f37; --add-bg: #dafbe1; --del: #cf222e; --del-bg: #ffebe9;
  --warn: #9a6700; --warn-bg: #fff8c5;
  --hl-kw: #cf222e; --hl-str: #0a3069; --hl-num: #0550ae; --hl-fn: #8250df; --hl-type: #953800; --hl-com: #59636e;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1117; --surface: #161b22; --border: #30363d; --fg: #e6edf3; --muted: #9198a1;
    --accent: #4493f8; --on-accent: #0d1117; --add: #3fb950; --add-bg: #12261e; --del: #f85149; --del-bg: #25171c;
    --warn: #d29922; --warn-bg: #272115;
    --hl-kw: #ff7b72; --hl-str: #a5d6ff; --hl-num: #79c0ff; --hl-fn: #d2a8ff; --hl-type: #ffa657; --hl-com: #8b949e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1117; --surface: #161b22; --border: #30363d; --fg: #e6edf3; --muted: #9198a1;
  --accent: #4493f8; --on-accent: #0d1117; --add: #3fb950; --add-bg: #12261e; --del: #f85149; --del-bg: #25171c;
  --warn: #d29922; --warn-bg: #272115;
  --hl-kw: #ff7b72; --hl-str: #a5d6ff; --hl-num: #79c0ff; --hl-fn: #d2a8ff; --hl-type: #ffa657; --hl-com: #8b949e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 var(--sans); }
main { max-width: 72ch; margin: 0 auto; padding: 32px 16px 64px; }
.wide { width: min(1100px, calc(100vw - 32px)); margin-left: 50%; transform: translateX(-50%); }
h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 4px; text-wrap: balance; }
h2 { font-size: 1.35rem; margin: 48px 0 12px; padding-top: 8px; border-top: 1px solid var(--border); text-wrap: balance; }
h3 { font-size: 1.05rem; margin: 24px 0 8px; }
a { color: var(--accent); }
code { font: 0.9em var(--mono); background: var(--surface); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre { font: 13px/1.5 var(--mono); background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px; overflow-x: auto; }
pre code { background: none; padding: 0; overflow-wrap: normal; }
.muted { color: var(--muted); }
.sub { color: var(--muted); margin: 0 0 24px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[x-cloak] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* highlight.js tokens: from the theme, so a host theme toggle recolors code too */
.hljs { color: var(--fg); background: none; }
.hljs-keyword, .hljs-built_in, .hljs-literal, .hljs-meta { color: var(--hl-kw); }
.hljs-string, .hljs-regexp { color: var(--hl-str); }
.hljs-number, .hljs-attr, .hljs-variable { color: var(--hl-num); }
.hljs-title, .hljs-title.function_ { color: var(--hl-fn); }
.hljs-type, .hljs-title.class_, .hljs-params { color: var(--hl-type); }
.hljs-comment, .hljs-quote { color: var(--hl-com); font-style: italic; }
.hljs-addition { color: var(--add); background: var(--add-bg); }
.hljs-deletion { color: var(--del); background: var(--del-bg); }

/* At a glance: metric tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 16px 0; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .label { font-size: 0.8rem; color: var(--muted); }
.tile .value { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .value.add { color: var(--add); } .tile .value.del { color: var(--del); } .tile .value.warn { color: var(--warn); }

/* Callouts and badges */
.callout { border-left: 4px solid var(--accent); background: var(--surface); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 16px 0; }
.callout.warn { border-color: var(--warn); background: var(--warn-bg); }
.badge { display: inline-block; font: 600 0.75rem/1.6 var(--sans); padding: 0 8px; border-radius: 999px;
         border: 1px solid var(--border); background: var(--surface); }
.badge.add { color: var(--add); border-color: var(--add); } .badge.del { color: var(--del); border-color: var(--del); }

/* Figures: D2 SVGs scale to the container */
figure { margin: 24px 0; }
/* On phones, keep labels legible: scroll the diagram inside its figure, not the page. */
figure .d2 { overflow-x: auto; }
figure .d2 svg { width: 100%; min-width: 640px; height: auto; display: block; }
figure .scroll-x { overflow-x: auto; }
figcaption { font-size: 0.9rem; color: var(--muted); margin-top: 8px; }

/* Segmented control (tabs / scenario toggle) */
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 8px 0 12px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 0.9rem; padding: 6px 14px; border: 0; background: var(--bg); color: var(--fg); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }

/* Step-through */
.steps-nav { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
.steps-nav button { font: inherit; padding: 4px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--fg); cursor: pointer; }
.steps-nav button:disabled { opacity: 0.4; cursor: default; }

/* Hover / focus cards on identifiers (native Popover API) */
button.ident { font: 0.9em var(--mono); background: var(--surface); border: 1px dashed var(--border); border-radius: 4px; padding: 0 5px; color: var(--fg); cursor: help; }
[popover] { max-width: min(420px, 90vw); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
            background: var(--surface); color: var(--fg); box-shadow: 0 8px 24px rgb(0 0 0 / 0.2); }

/* Tables */
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 600; }

/* diff2html: follow the page tokens */
.d2h-wrapper { font-size: 13px; }
.d2h-file-header { background: var(--surface) !important; border-color: var(--border) !important;
                   flex-wrap: wrap; height: auto !important; gap: 4px; }
.d2h-file-name-wrapper { min-width: 0; }
.d2h-file-name { overflow-wrap: anywhere; white-space: normal; }
details.diff > summary { cursor: pointer; color: var(--muted); }

.sources li { margin: 4px 0; }
</style>
</head>
<body>
<!-- PLAN (replaces plan.json; pagekit build strips it). One entry per section, in page order:
  id: claim | diagram? | interaction? | sources
-->
<main>
  <h1>{{TITLE}}</h1>
  <p class="sub">{{SUBTITLE}}</p>

  <section id="glance">
    <h2>At a glance</h2>
  </section>

{{PARTS}}

  <section id="sources">
    <h2>Sources</h2>
    <ul class="sources"></ul>
  </section>
</main>
<script>
  // Highlight code blocks when highlight.js loaded; plain <pre> otherwise.
  if (window.hljs) document.querySelectorAll('pre code[class*="language-"]').forEach(el => hljs.highlightElement(el));

  // Render the PR diff when diff2html loaded; keep the raw <details> fallback otherwise.
  // The color scheme follows a host data-theme first, then the OS, and redraws when either changes.
  const diffSrc = document.getElementById('diff-src');
  if (diffSrc && window.Diff2HtmlUI) {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const scheme = () => (document.documentElement.dataset.theme || (mq.matches ? 'dark' : 'light'));
    const draw = () => {
      const ui = new Diff2HtmlUI(document.getElementById('diff-view'), diffSrc.value, {
        drawFileList: false, matching: 'lines', outputFormat: 'line-by-line',
        colorScheme: scheme(), highlight: true, fileContentToggle: true,  // slim bundle ships its own highlighter
      });
      ui.draw();
      ui.highlightCode();
    };
    draw();
    mq.addEventListener('change', draw);
    new MutationObserver(draw).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});
    document.getElementById('diff-fallback')?.remove();
  }
</script>
</body>
</html>
